<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetCerca IA | Triaje</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <script src="app.js" defer></script>
  </head>
  <body class="bg-light">
    <header class="navbar bg-white border-bottom">
      <div class="container">
        <span class="navbar-brand mb-0 h1">VetCerca IA</span>
        <div class="d-flex align-items-center gap-3">
          <span id="welcomeMessage" class="text-secondary"></span>
          <button id="logoutButton" class="btn btn-outline-secondary btn-sm" type="button">
            Cerrar sesión
          </button>
        </div>
      </div>
    </header>

    <main class="container py-5">
      <section class="card shadow-sm border-0 mx-auto" style="max-width: 42rem;">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-2">Evaluación de triaje</h1>
          <p class="text-secondary mb-4">
            Describe los síntomas para recibir una orientación inicial.
          </p>
          <form id="triageForm">
            <div class="mb-3">
              <label for="nombreMascota" class="form-label">Nombre de la mascota</label>
              <input
                id="nombreMascota"
                name="nombre_mascota"
                class="form-control"
                type="text"
                required
              >
            </div>
            <div class="mb-3">
              <label for="sintomas" class="form-label">Síntomas</label>
              <textarea
                id="sintomas"
                name="sintomas"
                class="form-control"
                rows="4"
                required
              ></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Evaluar síntomas</button>
          </form>
          <pre
            id="triageResult"
            class="bg-light rounded p-3 mt-4 mb-0 text-wrap"
            role="status"
            aria-live="polite"
          ></pre>
        </div>
      </section>
    </main>
  </body>
</html>
