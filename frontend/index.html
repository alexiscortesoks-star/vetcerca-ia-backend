<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetCerca IA | Iniciar sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <script src="app.js" defer></script>
  </head>
  <body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
      <section class="card shadow-sm border-0 w-100" style="max-width: 28rem;">
        <div class="card-body p-4 p-md-5">
          <header class="text-center mb-4">
            <h1 class="h3">VetCerca IA</h1>
            <p class="text-secondary mb-0">Urgencias veterinarias con IA</p>
          </header>

          <form id="loginForm">
            <div class="mb-3">
              <label for="usuarioOEmail" class="form-label">Usuario o email</label>
              <input
                id="usuarioOEmail"
                name="usuario_o_email"
                class="form-control"
                type="text"
                autocomplete="username"
                required
              >
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input
                id="password"
                name="password"
                class="form-control"
                type="password"
                autocomplete="current-password"
                required
              >
            </div>
            <p id="loginMessage" class="small" role="status" aria-live="polite"></p>
            <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
