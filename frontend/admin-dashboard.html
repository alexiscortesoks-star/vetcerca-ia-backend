<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetCerca IA | Administración</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
    <script src="app.js?v=registro-veterinario" defer></script>
  </head>
  <body id="adminDashboard" class="landing-body">
    <header class="landing-header">
      <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-2">
        <a class="landing-brand" href="admin-dashboard.html">
          <img class="brand-logo" src="assets/vetcerca-logo-original.png" alt="VetCerca IA">
        </a>
        <div class="d-flex align-items-center gap-3">
          <span id="adminWelcome" class="welcome-message">Administración</span>
          <button id="adminLogoutButton" class="btn btn-coral btn-sm" type="button">
            Cerrar sesión
          </button>
        </div>
      </div>
    </header>
    <main class="container dashboard-main py-5">
      <div class="dashboard-intro">
        <span class="eyebrow">ADMINISTRACIÓN</span>
        <h1>Solicitudes veterinarias</h1>
        <p>Revisá los datos profesionales y aprobá o rechazá las solicitudes de acceso.</p>
      </div>
      <section class="vet-alerts-section mt-4" aria-labelledby="requestsHeading">
        <h2 id="requestsHeading" class="h4">Pendientes de revisión</h2>
        <p id="adminRequestsMessage" class="small" role="status" aria-live="polite"></p>
        <div id="adminRequestsList" class="d-grid gap-3"></div>
      </section>
    </main>
  </body>
</html>
