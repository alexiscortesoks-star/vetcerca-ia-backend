<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Acceso para veterinarias al portal de VetCerca IA."
    >
    <title>VetCerca IA | Acceso veterinario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body class="landing-body">
    <header class="landing-header">
      <div class="container d-flex align-items-center justify-content-between py-2">
        <a class="landing-brand" href="index.html">
          <img class="brand-logo" src="assets/vetcerca-logo-original.png" alt="VetCerca IA">
        </a>
        <a class="btn btn-outline-teal btn-sm" href="index.html">Volver al inicio</a>
      </div>
    </header>
    <main class="container veterinary-login-main">
      <section class="veterinary-login-card">
        <div class="veterinary-login-icon" aria-hidden="true">🏥</div>
        <span class="eyebrow">PORTAL PARA PROFESIONALES</span>
        <h1>Acceso veterinario</h1>
        <p class="text-secondary">
          Ingresá para consultar el perfil y la disponibilidad de tu clínica.
        </p>
        <form id="veterinaryLoginForm">
          <div class="mb-3">
            <label class="form-label" for="veterinaryUsername">Usuario</label>
            <input
              id="veterinaryUsername"
              class="form-control"
              name="usuario"
              autocomplete="username"
              required
            >
          </div>
          <div class="mb-3">
            <label class="form-label" for="veterinaryPassword">Contraseña</label>
            <input
              id="veterinaryPassword"
              class="form-control"
              type="password"
              name="password"
              autocomplete="current-password"
              required
            >
          </div>
          <p id="veterinaryLoginMessage" class="small" role="status" aria-live="polite"></p>
          <button class="btn btn-teal w-100 py-2" type="submit">Ingresar al portal</button>
        </form>
        <p class="demo-credentials mb-0">
          Acceso de demostración: <strong>admin</strong> / <strong>1234</strong>
        </p>
      </section>
    </main>
  </body>
</html>
